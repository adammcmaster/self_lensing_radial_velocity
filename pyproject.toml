[project]
name = "slrv"
version = "0.1.0"
description = ""
authors = [{ name = "Adam McMaster", email = "me@adam-mcmaster.com" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "astropy (>=7.1.0,<8.0.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "fastparquet (>=2024.11.0,<2025.0.0)",
    "emcee (>=3.1.6,<4.0.0)",
    "corner (>=2.2.3,<3.0.0)",
    "jax[cuda12] (>=0.10.0,<1.0.0)",
    "selflensing[cuda12] @ git+ssh://git@github.com/COBALT-lensing/py-self-lensing.git",
]

[dependency-groups]
dev = ["ipykernel>=6.30.1,<7"]

[tool.uv]
default-groups = "all"
package = false
